<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dota Pick</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 12px;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    h1 { font-size: 20px; text-align: center; }
    #search {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #888;
      margin-bottom: 12px;
    }
    #heroes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .hero { text-align: center; font-size: 12px; }
    .hero img { width: 100%; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Выбери героев</h1>
  <input id="search" placeholder="Поиск героя...">
  <div id="heroes">Загружаю героев...</div>

  <script>
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    let allHeroes = [];

    function show(list) {
      const box = document.getElementById("heroes");
      box.innerHTML = "";
      list.forEach(function (h) {
        const short = h.name.replace("npc_dota_hero_", "");
        const div = document.createElement("div");
        div.className = "hero";
        div.innerHTML =
          '<img src="https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/' +
          short + '.png" onerror="this.style.display=\'none\'"><div>' +
          h.localized_name + "</div>";
        box.appendChild(div);
      });
    }

    fetch("https://api.opendota.com/api/heroes")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        allHeroes = data.sort(function (a, b) {
          return a.localized_name.localeCompare(b.localized_name);
        });
        show(allHeroes);
      })
      .catch(function () {
        document.getElementById("heroes").textContent = "Не удалось загрузить героев";
      });

    document.getElementById("search").addEventListener("input", function (e) {
      const q = e.target.value.toLowerCase();
      show(allHeroes.filter(function (h) {
        return h.localized_name.toLowerCase().includes(q);
      }));
    });
  </script>
</body>
</html>
